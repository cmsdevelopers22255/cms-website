<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Creative Management Solutions — India-focused digital product company building products across wellness, commerce and emerging real-world opportunities."
  >

  <meta
    name="theme-color"
    content="#070b14"
  >

  <title>Creative Management Solutions | Building Products</title>

  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       CSS
       ===================================================== -->

  <style>

    /* =====================================================
       ROOT
       ===================================================== */

    :root {

      --bg: #070b14;
      --bg-soft: #0a101c;
      --bg-card: #0c1320;

      --text: #f4f7fb;
      --text-soft: #a6b0c2;
      --text-muted: #727d91;

      --cyan: #22d3ee;
      --indigo: #6366f1;

      /* VibeFit */
      --coral: #f2555f;
      --coral-soft: rgba(242, 85, 95, 0.12);
      --coral-glow: rgba(242, 85, 95, 0.28);

      /* KokanKart */
      --amber: #f4a636;
      --amber-soft: rgba(244, 166, 54, 0.12);
      --amber-glow: rgba(244, 166, 54, 0.28);

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);

      --container: 1180px;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 30px;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.24);

      --shadow-hover:
        0 30px 80px rgba(0, 0, 0, 0.38);

      --ease: cubic-bezier(.2,.75,.2,1);
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(34, 211, 238, 0.055),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(99, 102, 241, 0.055),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family: "Inter", sans-serif;
      line-height: 1.65;

      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       SCROLL PROGRESS
       ===================================================== */

    .scroll-progress {
      position: fixed;

      top: 0;
      left: 0;

      width: 0%;
      height: 3px;

      z-index: 99999;

      background:
        linear-gradient(
          90deg,
          var(--cyan) 0%,
          var(--indigo) 35%,
          var(--coral) 68%,
          var(--amber) 100%
        );

      box-shadow:
        0 0 18px rgba(34, 211, 238, 0.35);

      transition: width 0.08s linear;
    }


    /* =====================================================
       COMMON
       ===================================================== */

    .container {
      width: min(
        calc(100% - 40px),
        var(--container)
      );

      margin-inline: auto;
    }

    section {
      padding: 120px 0;
      position: relative;
    }

    .reveal {
      opacity: 0;
      transform: translateY(22px);

      transition:
        opacity 0.75s var(--ease),
        transform 0.75s var(--ease);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    nav {
      position: sticky;
      top: 0;

      z-index: 1000;

      border-bottom: 1px solid var(--border);

      background:
        rgba(7, 11, 20, 0.78);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nav-inner {
      width: min(
        calc(100% - 40px),
        var(--container)
      );

      min-height: 76px;

      margin-inline: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-family: "Sora", sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 36px;
      height: 36px;

      border-radius: 10px;

      display: grid;
      place-items: center;

      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-size: 14px;
    }

    .brand-name span {
      display: block;

      color: var(--text-muted);

      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 500;

      margin-top: 1px;

      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links > a:not(.nav-cta) {
      position: relative;

      color: var(--text-soft);

      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }

    .nav-links > a:not(.nav-cta)::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 100%;
      height: 1px;

      transform: scaleX(0);
      transform-origin: right;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--indigo)
        );

      transition:
        transform 0.25s ease;
    }

    .nav-links > a:not(.nav-cta):hover {
      color: var(--text);
    }

    .nav-links > a:not(.nav-cta):hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-cta {
      padding: 10px 15px;

      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 10px;

      color: var(--cyan);

      background: rgba(34, 211, 238, 0.05);

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;

      transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
    }

    .nav-cta:hover {
      transform: translateY(-2px);

      border-color: rgba(34, 211, 238, 0.45);

      background: rgba(34, 211, 238, 0.09);
    }

    .menu {
      display: none;

      border: 1px solid var(--border);
      border-radius: 10px;

      padding: 8px 10px;

      background: rgba(255,255,255,.03);

      color: var(--text);

      font-size: 20px;

      cursor: pointer;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .hero {
      min-height: calc(100vh - 76px);

      display: flex;
      align-items: center;

      padding:
        100px 0
        90px;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(380px, .95fr);

      gap: 70px;

      align-items: center;
    }

    .eyebrow,
    .kicker,
    .status,
    .tag,
    .panel-top,
    .live,
    .banner-tag,
    .banner-footer {
      font-family: "JetBrains Mono", monospace;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      color: var(--cyan);

      font-size: 11px;
      letter-spacing: .035em;

      margin-bottom: 25px;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 14px rgba(34, 211, 238, .7);
    }

    .hero h1 {
      max-width: 850px;

      font-family: "Sora", sans-serif;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.04;

      letter-spacing: -0.055em;
      font-weight: 700;
    }

    .gradient {
      background:
        linear-gradient(
          100deg,
          var(--cyan),
          var(--indigo) 55%,
          var(--coral)
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero-copy {
      max-width: 680px;

      margin-top: 28px;

      color: var(--text-soft);

      font-size: 17px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 32px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 46px;

      padding: 0 18px;

      border-radius: 12px;

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 600;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease,
        background .25s ease;
    }

    .btn::after {
      content: "";

      position: absolute;
      inset: 0;

      width: 35%;

      transform:
        translateX(-180%)
        skewX(-18deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.2),
          transparent
        );

      transition:
        transform .65s ease;

      pointer-events: none;
    }

    .btn:hover::after {
      transform:
        translateX(420%)
        skewX(-18deg);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.primary {
      color: #041018;

      background:
        linear-gradient(
          135deg,
          #4de5f5,
          #6b73f7
        );

      box-shadow:
        0 10px 30px rgba(34, 211, 238, .16);
    }

    .btn.primary:hover {
      box-shadow:
        0 16px 40px rgba(34, 211, 238, .25);
    }

    .btn.secondary {
      border: 1px solid var(--border-strong);

      color: var(--text-soft);

      background:
        rgba(255,255,255,.025);
    }

    .btn.secondary:hover {
      color: var(--text);

      border-color:
        rgba(255,255,255,.22);

      background:
        rgba(255,255,255,.05);
    }


    /* =====================================================
       HERO PANEL
       ===================================================== */

    .hero-panel {
      position: relative;

      padding: 18px;

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      background:
        rgba(255,255,255,.025);

      box-shadow:
        var(--shadow);

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .hero-panel:hover {
      transform: translateY(-4px);

      box-shadow:
        var(--shadow-hover);
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 5px 4px 17px;

      color: var(--text-muted);

      font-size: 10px;
      letter-spacing: .04em;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--cyan);
    }

    .live i {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 12px rgba(34,211,238,.7);
    }

    .panel-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .tile {
      position: relative;

      display: flex;
      flex-direction: column;
      justify-content: center;

      min-height: 130px;

      padding: 20px;

      overflow: hidden;

      border: 1px solid var(--border);

      border-radius: 16px;

      background:
        rgba(255,255,255,.025);

      transition:
        transform .3s ease,
        border-color .3s ease;
    }

    .tile.big {
      justify-content: flex-start;
    }

    .tile:hover {
      transform: translateY(-3px);

      border-color:
        rgba(255,255,255,.15);
    }

    .tile.big {
      grid-column: 1 / -1;

      background:
        radial-gradient(
          circle at 8% 20%,
          rgba(34,211,238,.18),
          transparent 34%
        ),
        radial-gradient(
          circle at 88% 15%,
          rgba(99,102,241,.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 55% 100%,
          rgba(242,85,95,.11),
          transparent 36%
        ),
        linear-gradient(
          145deg,
          rgba(255,255,255,.05),
          rgba(255,255,255,.015)
        );
    }

    .tile small {
      display: block;

      color: var(--text-muted);

      font-size: 10px;

      margin-bottom: 12px;
    }

    .tile strong {
      display: block;

      font-family: "Sora", sans-serif;

      font-size: 17px;

      letter-spacing: -.03em;
    }

    .tile p {
      color: var(--text-muted);

      font-size: 12px;

      margin-top: 7px;
    }

    .tile.accent-coral {
      border-top:
        2px solid var(--coral);
    }

    .tile.accent-coral small {
      color: var(--coral);
    }

    .tile.accent-teal {
      border-top:
        2px solid var(--cyan);
    }

    .tile.accent-teal small {
      color: var(--cyan);
    }

    .bar {
      position: absolute;

      left: 20px;
      right: 20px;
      bottom: 16px;

      height: 3px;

      overflow: hidden;

      border-radius: 100px;

      background: rgba(255,255,255,.07);
    }

    .bar span {
      display: block;

      width: 66%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--indigo)
        );
    }

    .bar.coral span {
      background: var(--coral);

      box-shadow:
        0 0 12px var(--coral-glow);
    }

    .bar.teal span {
      background: var(--cyan);

      box-shadow:
        0 0 12px rgba(34,211,238,.3);
    }


    /* =====================================================
       SECTION HEAD
       ===================================================== */

    .section-head {
      max-width: 760px;

      margin-bottom: 55px;
    }

    .kicker {
      display: inline-block;

      margin-bottom: 15px;

      color: var(--cyan);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .kicker.coral {
      color: var(--coral);
    }

    .kicker.teal {
      color: var(--cyan);
    }

    .kicker.amber {
      color: var(--amber);
    }

    .section-head h2 {
      font-family: "Sora", sans-serif;

      font-size:
        clamp(32px, 4vw, 50px);

      line-height: 1.1;

      letter-spacing: -.045em;
    }

    .section-head p {
      max-width: 690px;

      margin-top: 18px;

      color: var(--text-soft);

      font-size: 15px;
    }


    /* =====================================================
       ABOUT
       ===================================================== */

    .story-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      box-shadow:
        0 16px 45px rgba(0,0,0,.12);

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        var(--shadow-hover);

      border-color:
        var(--border-strong);
    }

    .story {
      padding: 32px;
    }

    .story h3 {
      font-family: "Sora", sans-serif;

      font-size: 24px;

      letter-spacing: -.035em;
    }

    .story > p {
      color: var(--text-soft);

      margin-top: 16px;

      font-size: 14px;
      line-height: 1.8;
    }

    .pillars {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 10px;

      margin-top: 28px;
    }

    .pillar {
      position: relative;

      display: flex;
      flex-direction: column;
      justify-content: center;

      min-height: 76px;

      padding: 17px 17px 17px 21px;

      overflow: hidden;

      border: 1px solid var(--border);

      border-radius: 13px;

      background:
        rgba(255,255,255,.018);

      transition:
        transform .25s ease,
        border-color .25s ease;
    }

    .pillar::before {
      content: "";

      position: absolute;

      left: 0;
      top: 50%;

      width: 3px;
      height: 28px;

      transform: translateY(-50%);

      border-radius: 100px;

      background: var(--cyan);

      box-shadow:
        0 0 12px var(--cyan);

      opacity: 0;

      transition:
        opacity .25s ease;
    }

    .pillar:hover::before {
      opacity: 1;
    }

    .pillar strong {
      display: block;

      font-family: "Sora", sans-serif;

      font-size: 15px;

      letter-spacing: -.03em;
    }

    .pillar p {
      color: var(--text-muted);

      font-size: 12px;

      margin-top: 5px;
    }

  </style>

</head>

<body>

  <div class="scroll-progress"></div>

  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <nav>
    <div class="nav-inner">

      <a href="#" class="brand">
        <div class="brand-mark">
          <img src="assets/cms-logo.png" alt="CMS Logo">
        </div>
        <div class="brand-name">
          Creative Management <span>Solutions</span>
        </div>
      </a>

      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
        <a href="#" class="nav-cta">Get Started</a>
      </div>

      <button class="menu" aria-label="Toggle menu">☰</button>

    </div>
  </nav>

</body>

</html>
